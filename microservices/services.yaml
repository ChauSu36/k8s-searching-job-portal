apiVersion: v1
kind: Namespace
metadata:
  name: microservices
---
# 1. ORDER SERVICE (Sinh JSON log chuẩn + Correlation ID request_id)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: microservices
spec:
  replicas: 1
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
    spec:
      containers:
      - name: order
        image: busybox
        args: [/bin/sh, -c,
          'while true; do
            REQ_ID="LAB-HV01-$(date +%s)";
            echo "{\"timestamp\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\",\"level\":\"INFO\",\"service\":\"order-service\",\"namespace\":\"microservices\",\"pod\":\"$HOSTNAME\",\"request_id\":\"$REQ_ID\",\"message\":\"Checkout initiated for customer\"}";
            sleep 2;
            echo "{\"timestamp\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\",\"level\":\"ERROR\",\"service\":\"order-service\",\"namespace\":\"microservices\",\"pod\":\"$HOSTNAME\",\"request_id\":\"$REQ_ID\",\"message\":\"Call to payment-service failed: Timeout\"}";
            sleep 3;
          done']
---
# 2. PAYMENT SERVICE (Ghi nhận request xử lý thanh toán)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-service
  namespace: microservices
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payment-service
  template:
    metadata:
      labels:
        app: payment-service
    spec:
      containers:
      - name: payment
        image: busybox
        args: [/bin/sh, -c,
          'while true; do
            echo "{\"timestamp\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\",\"level\":\"INFO\",\"service\":\"payment-service\",\"namespace\":\"microservices\",\"pod\":\"$HOSTNAME\",\"request_id\":\"LAB-HV01-FIXED\",\"message\":\"Card transaction verified successfully\"}";
            sleep 4;
          done']
