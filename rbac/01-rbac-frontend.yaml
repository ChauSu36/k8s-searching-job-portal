apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  namespace: frontend
  name: frontend-dev-role
rules:
  # Cấp quyền thao tác Pod, Log, Service, ConfigMap trong namespace frontend
  - apiGroups: [""]
    resources: ["pods", "pods/log", "services", "configmaps"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Cấp quyền quản lý Deployments, ReplicaSets
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  namespace: frontend
  name: frontend-dev-binding
subjects:
  - kind: User
    name: developer-frontend
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: Role
  name: frontend-dev-role
  apiGroup: rbac.authorization.k8s.io
