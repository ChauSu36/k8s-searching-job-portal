apiVersion: apps/v1
kind: Deployment
metadata:
  name: jobportal-backend-deployment
  namespace: jobportal
  labels:
    app: jobportal-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jobportal-backend
  template:
    metadata:
      labels:
        app: jobportal-backend
    spec:
      containers:
      - name: jobportal-backend
        image: chausu/jobportal-backend:2f04f262542aead7fd4d3124421fdf092b7ab662
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
        envFrom:
        - configMapRef:
            name: jobportal-backend-config
        - secretRef:
            name: jobportal-backend-secret
