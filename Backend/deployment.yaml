apiVersion: apps/v1
kind: Deployment
metadata:
  name: jobportal-backend-deployment
  namespace: jobportal
  labels:
    app: jobportal-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jobportal-backend
  template:
    metadata:
      labels:
        app: jobportal-backend
    spec:
      containers:
      - name: jobportal-backend
        image: chausu/jobportal-backend:12808ac2d6aa0c04cd069defd683199c1f34d54a
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
        envFrom:
        - configMapRef:
            name: jobportal-backend-config
        - secretRef:
            name: jobportal-backend-secret
